services:
  - type: web
    name: tutlee-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate && daphne -b 0.0.0.0 -p $PORT tutlee.asgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "tutlee.com,tutlee-backend.onrender.com,tutlee-hq.github.io"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: tutlee-db
          property: connectionString

databases:
  - name: tutlee-db
    databaseName: tutlee
    user: tutlee
